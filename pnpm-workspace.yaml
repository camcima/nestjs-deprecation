allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  lefthook: true

# Security floors for dev-only transitive dependencies. These are not published,
# so they only protect this repo's own installs -- and `audit:deps` is --prod, so
# it will not catch a regression here. Verified against `pnpm audit` on 2026-08-28;
# the fastify, multer and undici floors were added on 2026-10-25.
overrides:
  # @nestjs/platform-fastify pulls 9.6.0, which is vulnerable to an HTTP/2 DoS (high).
  find-my-way: ^9.7.0
  # @nestjs/swagger pulls 5.2.1: exponential parsing time in flow collections (high).
  '@nestjs/swagger>js-yaml': ^5.2.2
  # @nestjs/platform-fastify pins fastify exactly (12.0.3: 5.12.4), which is affected
  # by GHSA-4mh8-r7rc-xpvc and GHSA-389g-gv7q-r4x8 (fixed in 5.12.6). Scoped to the
  # 5.x line so the Nest 10 peer-floor job keeps the fastify 4 it was built against.
  '@nestjs/platform-fastify>fastify@5': ^5.12.7
  # @nestjs/platform-express pins multer exactly (12.0.3: 2.4.0): GHSA-q7qp-rjg7-q26m,
  # fixed in 2.5.0. Scoped to 2.x so the Nest 10/11 floors keep their multer 1.x.
  '@nestjs/platform-express>multer@2': ^2.5.0
  # release-it 21.1.1 pins undici exactly at 7.29.1: GHSA-xjj6-f33q-929c,
  # GHSA-4qv8-2p9j-2685 and GHSA-f72v-6w45-q472, fixed in 7.30.1.
  release-it>undici: ^7.30.1
  # Redundant today (vite -> postcss already resolves 3.3.18); kept as a floor in
  # case a postcss downgrade drags nanoid back below it.
  postcss>nanoid: ^3.3.18
