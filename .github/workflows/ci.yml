name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict the default GITHUB_TOKEN to read-only; no CI job needs write access.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every action-setup step here resolves pnpm from "packageManager" in
      # package.json, which is still on pnpm 10. pnpm 11 requires Node >=22.13,
      # above both the engines.node floor (>=22) and the 22.12.0 pack-compat leg
      # below, so moving to it means raising those first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format

  test:
    runs-on: ubuntu-latest
    strategy:
      # A break on one Node version says nothing about the others, and finding
      # out which ones are affected is the point of the matrix.
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:cov
      - name: Upload coverage to Codecov
        # One upload per commit is enough; the matrix runs the same suite on
        # every Node version. Dependabot PRs are included: v7 uploads fine from
        # a restricted token on a public repo, so the exclusion this step used
        # to carry is no longer needed.
        if: matrix.node-version == 22
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:pack

  # The build job above smoke-tests the tarball against the default Nest line
  # (NEST_MAJOR in scripts/pack-smoke.sh). It stays a single job because
  # "build" is a required status check; the other lines are covered here.
  pack-compat:
    name: Pack smoke (nest ${{ matrix.nest }} / node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: 10
            node: 22
          - nest: 11
            node: 22
          # Nest 12's floor on the 22.x line: the first 22.x release that lets
          # CommonJS code (this library's dist included) require() Nest's
          # ESM-only packages without a flag.
          - nest: 12
            node: '22.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:pack
        env:
          NEST_MAJOR: ${{ matrix.nest }}

  peer-compat:
    name: Peer floors (nest ${{ matrix.nest }} / swagger ${{ matrix.swagger }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.0.0'
            swagger: '7.0.0'
          - nest: '10.0.0'
            swagger: '8.0.0'
          # @nestjs/swagger 11.0.0 declares a peer on @nestjs/common ^11.0.1.
          - nest: '11.0.1'
            swagger: '11.0.0'
          - nest: '12.0.0'
            swagger: '12.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin lowest supported peers
        run: >
          pnpm add -D
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/platform-express@${{ matrix.nest }}
          @nestjs/platform-fastify@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}
          @nestjs/swagger@${{ matrix.swagger }}
      - run: pnpm run test

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --call-analysis=false
            .
