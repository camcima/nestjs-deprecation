version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # Held by maintainer (2026-10): remove this entry to resume updates
      - dependency-name: '@nestjs/*'
      # Held by maintainer (2026-10): major updates only; minor and patch
      # updates flow.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint 8.x supports typescript <6.1.0 and throws on TS 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # Published without provenance, unlike 2.1.x-2.2.1; pnpm's
      # trust-policy=no-downgrade rejects it as a possible package takeover.
      - dependency-name: 'lefthook'
        versions:
          - '2.2.2'
    groups:
      production-dependencies:
        dependency-type: 'production'
      dev-dependencies:
        dependency-type: 'development'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
